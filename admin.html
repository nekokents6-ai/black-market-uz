<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORANGE — Админ-панель</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#222;background:#fff8f0}*{box-sizing:border-box}body{margin:0}header{background:#ff7417;color:white;padding:22px max(18px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:24px}.wrap{max-width:1120px;margin:28px auto;padding:0 16px}.panel{background:white;border:1px solid #f0dfd1;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 5px 22px #5a260b0a}input,select,textarea{width:100%;padding:11px;border:1px solid #ddcfc4;border-radius:9px;font:inherit;margin:5px 0 12px}button{border:0;border-radius:9px;padding:11px 15px;background:#ff7417;color:white;font-weight:700;cursor:pointer}button.secondary{background:#fff0e4;color:#a84700}button.danger{background:#b83225}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.rowitem{border-top:1px solid #eee;padding:14px 0;display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}.muted{color:#786d65;font-size:13px}.hidden{display:none!important}.error{color:#b83225}.success{color:#167b42}.orderitems{white-space:pre-line;font-size:14px}.price{font-weight:800;color:#d65a00}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}label{font-size:14px;font-weight:650}
</style></head><body>
<header><h1>🍊 ORANGE · Админ-панель</h1><button id="logout" class="hidden" onclick="logout()">Выйти</button></header>
<div class="wrap">
<section id="loginPanel" class="panel" style="max-width:440px;margin:50px auto"><h2>Вход администратора</h2><p class="muted">Вход доступен только аккаунту, которому владелец назначил роль admin.</p><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com"><label>Пароль</label><input id="password" type="password" autocomplete="current-password"><button onclick="login()">Войти</button><p id="loginMsg" class="error"></p></section>
<section id="dashboard" class="hidden">
<div class="tabs"><button onclick="showTab('orders')">Заказы</button><button class="secondary" onclick="showTab('products')">Меню и цены</button></div>
<div id="ordersTab" class="panel"><div class="topline"><h2>Новые и текущие заказы</h2><button class="secondary" onclick="loadOrders()">Обновить</button></div><p class="muted">Обновляй список вручную. Статус меняется и сохраняется в базе.</p><div id="ordersList">Загрузка…</div></div>
<div id="productsTab" class="panel hidden"><div class="topline"><h2>Управление меню</h2><button class="secondary" onclick="loadProducts()">Обновить</button></div>
<form id="productForm"><input type="hidden" id="productId"><div class="grid"><label>Название<input id="pName" required maxlength="120"></label><label>Категория<input id="pCategory" required placeholder="burger / lavash / pizza"></label><label>Цена в сумах<input id="pPrice" type="number" min="0" required></label><label>Фото (URL)<input id="pImage" type="url"></label><label>Метка<input id="pTag"></label><label>Описание<input id="pDesc"></label></div><div class="tabs"><button type="submit">Сохранить блюдо</button><button type="button" class="secondary" onclick="resetProduct()">Очистить</button></div><p id="productMsg" class="muted"></p></form><div id="productsList">Загрузка…</div></div>
</section></div>
<script>
const URL="https://seqwmjflzosqheeariil.supabase.co";
const KEY="sb_publishable_eco7kq2kY0A_Xf28ijedyg_lGqlDLgd";
let db=null;
try {
  if(!window.supabase?.createClient) throw new Error("Supabase JS не загрузился. Проверь подключение к интернету или блокировщик.");
  db=window.supabase.createClient(URL,KEY);
} catch(e) {
  window.addEventListener("DOMContentLoaded",()=>{const m=document.getElementById("loginMsg");if(m)m.textContent=e.message;});
}
const el=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat("ru-RU").format(n)+" сум";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function login(){
  const msg=el("loginMsg");
  msg.textContent="";
  if(!db){msg.textContent="Не удалось загрузить систему входа. Обнови страницу или проверь интернет.";return;}
  const btn=document.querySelector("#loginPanel button");
  btn.disabled=true;btn.textContent="Входим…";
  try {
    const {data,error}=await db.auth.signInWithPassword({email:el("email").value.trim(),password:el("password").value});
    if(error){msg.textContent="Ошибка входа: "+error.message;return;}
    await checkUser(data.session);
  } catch(e) {
    msg.textContent="Ошибка подключения: "+(e?.message||"попробуй ещё раз");
  } finally {
    btn.disabled=false;btn.textContent="Войти";
  }
}
async function checkUser(session){
  if(!session){el("loginPanel").classList.remove("hidden");el("dashboard").classList.add("hidden");el("logout").classList.add("hidden");return;}
  if(!db){el("loginMsg").textContent="Система входа не загрузилась. Обнови страницу.";return;}
  try {
    const {data,error}=await db.auth.getUser();
    if(error)throw error;
    if(data.user?.app_metadata?.role!=="admin"){
      await db.auth.signOut();
      el("loginMsg").textContent="Вход выполнен, но у аккаунта нет роли admin. Проверь назначение роли и войди заново.";
      return;
    }
    el("loginPanel").classList.add("hidden");el("dashboard").classList.remove("hidden");el("logout").classList.remove("hidden");loadOrders();
  } catch(e) { el("loginMsg").textContent="Не удалось проверить права: "+(e?.message||"ошибка подключения"); }
}
async function logout(){await db.auth.signOut();checkUser(null);}
function showTab(tab){el("ordersTab").classList.toggle("hidden",tab!=="orders");el("productsTab").classList.toggle("hidden",tab!=="products");if(tab==="products")loadProducts();}
const statusLabels={new:"Новый",confirmed:"Подтверждён",preparing:"Готовится",ready:"Готов",on_the_way:"В пути",completed:"Завершён",cancelled:"Отменён"};
async function loadOrders(){el("ordersList").textContent="Загрузка…";const {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false}).limit(100);if(error){el("ordersList").textContent="Ошибка загрузки заказов.";return;}if(!data.length){el("ordersList").textContent="Пока заказов нет.";return;}el("ordersList").innerHTML=data.map(o=>{const lines=Array.isArray(o.items)?o.items.map(i=>i.name+" × "+i.quantity+" — "+money(i.line_total_uzs)).join("\n"):"";const map=o.customer_latitude!=null&&o.customer_longitude!=null?"https://www.google.com/maps?q="+o.customer_latitude+","+o.customer_longitude:"";return '<article class="rowitem"><div style="flex:1;min-width:250px"><b>Заказ №'+esc(o.order_number)+' · '+esc(o.customer_name)+'</b><div class="muted">'+esc(o.customer_phone)+' · '+new Date(o.created_at).toLocaleString("ru-RU")+'</div><div class="orderitems">'+esc(lines)+'</div><div class="muted">'+esc(o.fulfillment_type==="delivery"?"Доставка: "+(o.delivery_address||""):"Самовывоз")+' · '+esc(o.payment_method)+'</div>'+(map?'<a target="_blank" rel="noopener" href="'+map+'">Открыть точку доставки</a>':"")+'<div class="price">'+money(o.total_uzs)+'</div></div><div style="min-width:160px"><label>Статус</label><select onchange="changeStatus(\''+o.id+'\',this.value)">'+Object.entries(statusLabels).map(([k,v])=>'<option value="'+k+'" '+(o.status===k?"selected":"")+'>'+v+'</option>').join("")+'</select></div></article>'}).join("");}
async function changeStatus(id,status){const {error}=await db.from("orders").update({status}).eq("id",id);if(error){alert("Не удалось изменить статус.");loadOrders();}}
async function loadProducts(){el("productsList").textContent="Загрузка…";const {data,error}=await db.from("products").select("*").order("category").order("id");if(error){el("productsList").textContent="Ошибка загрузки меню.";return;}el("productsList").innerHTML=data.map(p=>'<article class="rowitem"><div style="flex:1"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.category)+' · '+money(p.price_uzs)+' · '+(p.is_active?"В продаже":"Скрыто")+'</div></div><button class="secondary" onclick="editProduct('+p.id+')">Изменить</button><button class="'+(p.is_active?"danger":"secondary")+'" onclick="toggleProduct('+p.id+','+(!p.is_active)+')">'+(p.is_active?"Скрыть":"Вернуть")+'</button></article>').join("");}
async function editProduct(id){const {data,error}=await db.from("products").select("*").eq("id",id).single();if(error)return alert("Не удалось открыть блюдо");el("productId").value=data.id;el("pName").value=data.name;el("pCategory").value=data.category;el("pPrice").value=data.price_uzs;el("pImage").value=data.image_url||"";el("pTag").value=data.tag||"";el("pDesc").value=data.description||"";window.scrollTo({top:0,behavior:"smooth"});}
function resetProduct(){el("productForm").reset();el("productId").value="";}
el("productForm").addEventListener("submit",async e=>{e.preventDefault();const id=el("productId").value;const row={name:el("pName").value.trim(),category:el("pCategory").value.trim(),price_uzs:Number(el("pPrice").value),image_url:el("pImage").value.trim()||null,tag:el("pTag").value.trim()||null,description:el("pDesc").value.trim()||null};let q=id?db.from("products").update(row).eq("id",id):db.from("products").insert(row);const {error}=await q;if(error){el("productMsg").textContent="Не удалось сохранить. Проверь данные.";return;}el("productMsg").textContent="Сохранено.";resetProduct();loadProducts();});
async function toggleProduct(id,active){const {error}=await db.from("products").update({is_active:active}).eq("id",id);if(error)alert("Не удалось изменить блюдо");loadProducts();}
if(db) db.auth.getSession().then(({data})=>checkUser(data.session)).catch(e=>{el("loginMsg").textContent="Ошибка запуска: "+e.message;});
</script></body></html>
